<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 340" role="img" aria-labelledby="title description">
  <title id="title">Three position-based physics ideas</title>
  <desc id="description">A looping animation showing Verlet prediction, clamping a point to a boundary, and separating two overlapping circles.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#526a70" />
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #203239; }
      .heading { font-size: 18px; font-weight: 700; }
      .label { font-size: 13px; }
      .muted { fill: #63777b; }
      .panel { fill: #fbfcf8; stroke: #cbd6d1; stroke-width: 1.5; }
    </style>
  </defs>
  <rect width="1080" height="340" rx="8" fill="#edf2ee" />

  <rect class="panel" x="12" y="12" width="344" height="316" rx="7" />
  <text class="heading" x="30" y="44">1. Predict with position history</text>
  <line x1="52" y1="150" x2="316" y2="150" stroke="#cbd6d1" stroke-width="2" />
  <circle cx="92" cy="150" r="11" fill="#a5b3b2" />
  <circle cx="164" cy="150" r="12" fill="#287b83" />
  <circle cx="246" cy="150" r="12" fill="#fbfcf8" stroke="#d18036" stroke-width="3" stroke-dasharray="5 4" />
  <line x1="178" y1="112" x2="231" y2="112" stroke="#526a70" stroke-width="2" marker-end="url(#arrow)" />
  <text class="label muted" x="66" y="184">previous</text>
  <text class="label" x="140" y="184">current</text>
  <text class="label" x="218" y="184">predicted</text>
  <text class="label muted" x="31" y="236">The old-to-current gap stores motion.</text>
  <text class="label muted" x="31" y="258">Extend it, then add acceleration.</text>
  <circle cx="164" cy="150" r="6" fill="#d18036">
    <animate attributeName="cx" values="164;246;246;164" keyTimes="0;0.42;0.72;1" dur="3.2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="1;1;0.15;1" keyTimes="0;0.42;0.72;1" dur="3.2s" repeatCount="indefinite" />
  </circle>

  <rect class="panel" x="368" y="12" width="344" height="316" rx="7" />
  <text class="heading" x="386" y="44">2. Project back inside</text>
  <line x1="421" y1="151" x2="660" y2="151" stroke="#526a70" stroke-width="4" />
  <line x1="421" y1="122" x2="421" y2="181" stroke="#287b83" stroke-width="3" />
  <line x1="660" y1="122" x2="660" y2="181" stroke="#287b83" stroke-width="3" />
  <text class="label muted" x="401" y="204">minimum</text>
  <text class="label muted" x="642" y="204">maximum</text>
  <line x1="690" y1="111" x2="668" y2="111" stroke="#526a70" stroke-width="2" marker-end="url(#arrow)" />
  <circle cx="690" cy="151" r="12" fill="#d85e4c">
    <animate attributeName="cx" values="690;660;660;690" keyTimes="0;0.42;0.72;1" dur="3.2s" repeatCount="indefinite" />
  </circle>
  <text class="label muted" x="390" y="250">Outside values move to the edge.</text>
  <text class="label muted" x="390" y="272">Values already inside do not move.</text>

  <rect class="panel" x="724" y="12" width="344" height="316" rx="7" />
  <text class="heading" x="742" y="44">3. Separate overlapping circles</text>
  <line x1="776" y1="151" x2="1014" y2="151" stroke="#cbd6d1" stroke-width="2" />
  <circle cx="852" cy="151" r="34" fill="#287b83" fill-opacity="0.82" stroke="#175c63" stroke-width="2">
    <animate attributeName="cx" values="852;840;840;852" keyTimes="0;0.42;0.72;1" dur="3.2s" repeatCount="indefinite" />
  </circle>
  <circle cx="898" cy="151" r="34" fill="#d18036" fill-opacity="0.78" stroke="#a6571d" stroke-width="2">
    <animate attributeName="cx" values="898;910;910;898" keyTimes="0;0.42;0.72;1" dur="3.2s" repeatCount="indefinite" />
  </circle>
  <line x1="851" y1="96" x2="899" y2="96" stroke="#526a70" stroke-width="2" marker-end="url(#arrow)" />
  <text class="label muted" x="747" y="236">Move both by inverse mass.</text>
  <text class="label muted" x="747" y="258">Then solve the cloth constraints again.</text>
</svg>
